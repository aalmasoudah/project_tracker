name: insight-tracker

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_USER: tracker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-database.sql:ro
      - tracker_postgres_data:/var/lib/postgresql/data

volumes:
  tracker_postgres_data:
