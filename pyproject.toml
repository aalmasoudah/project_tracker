[project]
name = "insight-tracker"
version = "0.1.0"
description = "Internal project, course, task, trainee, and attendance tracker."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "arabic-reshaper>=3.0.1,<4",
    "celery[redis]>=5.5,<6",
    "Django>=5.2,<5.3",
    "django-storages[s3]>=1.14,<2",
    "gunicorn>=23,<24",
    "hijridate>=2.6,<3",
    "openpyxl>=3.1,<4",
    "Pillow>=12,<13",
    "psycopg[binary]>=3.2,<4",
    "python-bidi>=0.6.11,<0.7",
    "reportlab>=5,<6",
    "whitenoise[brotli]>=6.9,<7",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "mypy>=1.17,<2",
    "playwright>=1.54,<2",
    "polib>=1.2,<2",
    "pytest>=8.4,<9",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<1",
    "types-polib>=1.2,<2",
    "types-openpyxl>=3.1,<4",
    "types-reportlab>=4.4,<5",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
addopts = "-ra --strict-config --strict-markers"
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = [
    "browser: critical Playwright browser workflow",
    "integration: PostgreSQL-backed Django integration test",
    "security: security-relevant behavior",
    "unit: isolated unit test",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = [".venv", ".venv-phase1", ".uv-cache-temp", "output"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "DJ",
    "E",
    "F",
    "I",
    "RUF",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012"]
"config/settings/*.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unreachable = true
exclude = [
    "^apps/.*/migrations/",
    "^\\.venv",
    "^\\.uv-cache-temp",
    "^output/",
    "^tmp/",
]

[tool.django-stubs]
django_settings_module = "config.settings.testing"
