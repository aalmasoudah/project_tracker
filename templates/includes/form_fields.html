{% if form.non_field_errors %}
  <div class="alert alert-danger" role="alert">{{ form.non_field_errors }}</div>
{% endif %}

{% for field in form %}
  <div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">
      {{ field.label }}
      {% if field.field.required %}<span aria-hidden="true" class="text-danger">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}
      <div class="form-text" id="{{ field.id_for_label }}_helptext">{{ field.help_text }}</div>
    {% endif %}
    {% if field.errors %}
      <div class="invalid-feedback d-block" role="alert">{{ field.errors }}</div>
    {% endif %}
  </div>
{% endfor %}
