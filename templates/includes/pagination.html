{% load i18n %}
{% if page.has_other_pages %}
  <nav class="mt-4" aria-label="{% translate 'Previous' %} / {% translate 'Next' %}">
    <ul class="pagination">
      {% if page.has_previous %}
        <li class="page-item">
          <a class="page-link" href="{% querystring page=page.previous_page_number %}">{% translate "Previous" %}</a>
        </li>
      {% endif %}
      <li class="page-item disabled">
        <span class="page-link"><bdi>{{ page.number }} / {{ page.paginator.num_pages }}</bdi></span>
      </li>
      {% if page.has_next %}
        <li class="page-item">
          <a class="page-link" href="{% querystring page=page.next_page_number %}">{% translate "Next" %}</a>
        </li>
      {% endif %}
    </ul>
  </nav>
{% endif %}
